<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>لوحة تحكم — مستشفى المستقبل</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
  <header class="admin-header">
    <div class="container">
      <h1>لوحة تحكم المستشفى</h1>
      <nav>
        <button id="showAppointments">المواعيد</button>
        <button id="showDoctors">الأطباء</button>
        <button id="showApplications">طلبات الأطباء</button>
        <button id="btnLogout" class="hidden">تسجيل خروج</button>
      </nav>
    </div>
  </header>

  <main class="container admin-main">
    <div id="loginPanel" class="panel login-panel">
      <h2>تسجيل دخول المشرف</h2>
      <form id="loginForm">
        <input name="username" placeholder="اسم المستخدم" required>
        <input name="password" type="password" placeholder="كلمة المرور" required>
        <button type="submit">دخول</button>
      </form>
      <div id="loginMsg" style="color:crimson;margin-top:8px"></div>
    </div>

    <section id="appointmentsSection" class="panel">
      <h2>المواعيد</h2>
      <table id="appointmentsTable">
        <thead><tr><th>الاسم</th><th>الهاتف</th><th>القسم</th><th>حالة</th><th>التاريخ</th><th>إجراءات</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <section id="doctorsSection" class="panel hidden">
      <h2>الأطباء</h2>
      <form id="doctorForm">
        <input name="name" placeholder="اسم الطبيب" required>
        <input name="specialty" placeholder="التخصص">
        <textarea name="bio" placeholder="نبذة قصيرة"></textarea>
        <button type="submit">إضافة طبيب</button>
      </form>
      <table id="doctorsTable">
        <thead><tr><th>الاسم</th><th>التخصص</th><th>إجراءات</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="/admin/js/admin.js"></script>
</body>
</html>
