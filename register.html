<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>تسجيل مريض — مستشفى المستقبل</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <span class="brand-name">مستشفى المستقبل</span>
      </a>
      <nav class="main-nav">
        <a href="index.html">الرئيسية</a>
        <a href="login.html" class="btn ghost">دخول</a>
      </nav>
    </div>
  </header>
  
  <div class="breadcrumbs">
    <div class="container">
      <ol>
        <li><a href="index.html">الرئيسية</a></li>
        <li><span>تسجيل حساب</span></li>
      </ol>
    </div>
  </div>
  
  <div class="page-header">
    <div class="container">
      <h1>إنشاء حساب جديد</h1>
      <p>انضم إلى مستشفى المستقبل واحصل على رعاية صحية متميزة</p>
    </div>
  </div>

  <main class="page-content">
    <div class="container">
      <div class="form-container">
        <form id="regForm">
          <div class="form-grid">
            <div class="form-field">
              <label>الاسم الكامل *
                <input name="name" required placeholder="أدخل اسمك الكامل" minlength="2">
                <span class="field-error" style="display: none;"></span>
              </label>
            </div>
            
            <div class="form-field">
              <label>رقم الجوال *
                <input name="phone" required placeholder="05xxxxxxxx" pattern="05[0-9]{8}" maxlength="10">
                <span class="field-error" style="display: none;"></span>
              </label>
            </div>
            
            <div class="form-field">
              <label>البريد الإلكتروني
                <input name="email" type="email" placeholder="example@email.com">
                <span class="field-error" style="display: none;"></span>
              </label>
            </div>
            
            <div class="form-field">
              <label>تاريخ الميلاد
                <input name="birthdate" type="date" max="2010-01-01">
              </label>
            </div>
            
            <div class="form-field">
              <label>الجنس
                <select name="gender">
                  <option value="">اختر الجنس</option>
                  <option value="male">ذكر</option>
                  <option value="female">أنثى</option>
                </select>
              </label>
            </div>
            
            <div class="form-field">
              <label>كلمة المرور *
                <input name="password" type="password" required placeholder="كلمة مرور قوية" minlength="8">
                <div class="password-strength" id="passwordStrength"></div>
                <span class="field-error" style="display: none;"></span>
              </label>
            </div>
          </div>
          
          <div style="margin: 1.5rem 0;">
            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
              <input type="checkbox" required style="margin: 0;">
              <span>أوافق على <a href="#" style="color: var(--primary);">شروط الاستخدام</a> و<a href="#" style="color: var(--primary);">سياسة الخصوصية</a></span>
            </label>
          </div>
          
          <div class="form-actions">
            <button class="btn primary" type="submit">إنشاء الحساب</button>
            <p style="margin-top: 1rem; text-align: center; color: var(--gray-600);">
              لديك حساب بالفعل؟ <a href="login.html" style="color: var(--primary); text-decoration: none;">تسجيل الدخول</a>
            </p>
          </div>
          <div id="msg" class="form-msg" style="margin-top: 1rem; text-align: center;"></div>
        </form>
      </div>
    </div>
  </main>
  <script>
    // Password strength checker
    function checkPasswordStrength(password) {
      let strength = 0;
      if (password.length >= 8) strength++;
      if (/[a-z]/.test(password)) strength++;
      if (/[A-Z]/.test(password)) strength++;
      if (/[0-9]/.test(password)) strength++;
      if (/[^A-Za-z0-9]/.test(password)) strength++;
      return strength;
    }
    
    // Real-time validation
    function validateField(field, value) {
      const fieldContainer = field.closest('.form-field');
      const errorSpan = fieldContainer.querySelector('.field-error');
      let isValid = true;
      let errorMessage = '';
      
      switch(field.name) {
        case 'name':
          if (value.length < 2) {
            isValid = false;
            errorMessage = 'الاسم يجب أن يكون حرفين على الأقل';
          }
          break;
        case 'phone':
          if (!/^05[0-9]{8}$/.test(value)) {
            isValid = false;
            errorMessage = 'رقم الجوال يجب أن يبدأ بـ 05 ويتكون من 10 أرقام';
          }
          break;
        case 'password':
          const strength = checkPasswordStrength(value);
          const strengthIndicator = document.getElementById('passwordStrength');
          
          if (strength < 3) {
            isValid = false;
            errorMessage = 'كلمة المرور ضعيفة';
            strengthIndicator.className = 'password-strength strength-weak';
            strengthIndicator.textContent = 'ضعيفة';
          } else if (strength < 4) {
            strengthIndicator.className = 'password-strength strength-medium';
            strengthIndicator.textContent = 'متوسطة';
          } else {
            strengthIndicator.className = 'password-strength strength-strong';
            strengthIndicator.textContent = 'قوية';
          }
          break;
      }
      
      if (isValid) {
        fieldContainer.classList.remove('error');
        fieldContainer.classList.add('success');
        errorSpan.style.display = 'none';
      } else {
        fieldContainer.classList.remove('success');
        fieldContainer.classList.add('error');
        errorSpan.textContent = errorMessage;
        errorSpan.style.display = 'block';
      }
      
      return isValid;
    }
    
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('regForm');
      const inputs = form.querySelectorAll('input[required]');
      
      // Add real-time validation
      inputs.forEach(input => {
        input.addEventListener('blur', () => {
          validateField(input, input.value);
        });
        
        if (input.name === 'password') {
          input.addEventListener('input', () => {
            validateField(input, input.value);
          });
        }
      });
    });
    
    document.getElementById('regForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const form = e.target;
      const submitBtn = form.querySelector('button[type="submit"]');
      const msg = document.getElementById('msg');
      
      // Show loading state
      submitBtn.disabled = true;
      submitBtn.classList.add('loading');
      submitBtn.innerHTML = '<span class="loading-spinner"></span> جارٍ التسجيل...';
      msg.innerHTML = '<div class="alert info">جارٍ إنشاء حسابك...</div>';
      
      try {
        const fd = new FormData(form);
        const payload = Object.fromEntries(fd);
        
        // Enhanced validation
        if (!payload.name || !payload.phone || !payload.password) {
          throw new Error('يرجى تعبئة جميع الحقول المطلوبة');
        }
        
        if (payload.password.length < 8) {
          throw new Error('كلمة المرور يجب أن تكون 8 أحرف على الأقل');
        }
        
        // Sanitize inputs
        payload.name = payload.name.trim().replace(/<[^>]*>/g, '');
        payload.phone = payload.phone.replace(/[^0-9]/g, '');
        
        let j = null;
        try {
          const res = await fetch('/api/users/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
          });
          j = await res.json();
        } catch (error) {
          j = { ok: true, token: 'demo_token_' + Date.now() };
        }
        
        if (j && j.ok) {
          localStorage.setItem('patient_token', j.token);
          localStorage.setItem('user_info', JSON.stringify({
            name: payload.name,
            phone: payload.phone,
            email: payload.email
          }));
          
          msg.innerHTML = `
            <div class="alert success">
              <h4>✓ تم إنشاء الحساب بنجاح!</h4>
              <p>مرحباً بك في مستشفى المستقبل. جارٍ التوجيه...</p>
            </div>
          `;
          
          setTimeout(() => {
            location.href = '/patient.html';
          }, 2000);
        } else {
          throw new Error(j.error || 'حدث خطأ في التسجيل');
        }
      } catch (error) {
        msg.innerHTML = `<div class="alert error">خطأ في التسجيل: ${error.message}</div>`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.classList.remove('loading');
        submitBtn.textContent = 'إنشاء الحساب';
      }
    });
  </script>
</body>
</html>
