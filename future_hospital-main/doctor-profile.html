<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ملف الطبيب — مستشفى المستقبل</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <span class="brand-name">مستشفى المستقبل</span>
      </a>
      <nav class="main-nav">
        <a href="index.html">الرئيسية</a>
        <a href="booking.html" class="btn">حجز موعد</a>
      </nav>
    </div>
  </header>
  
  <div class="page-header">
    <div class="container">
      <h1 id="doctorName">ملف الطبيب</h1>
      <p id="doctorSpecialty">جارٍ التحميل...</p>
    </div>
  </div>

  <main class="page-content">
    <div class="container">
      <div id="doctorContent" class="cards">
        <div class="card">
          <div style="text-align: center; padding: 2rem;">
            جارٍ تحميل بيانات الطبيب...
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(location.search);
      const doctorSlug = params.get('slug');
      
      if (!doctorSlug) {
        document.getElementById('doctorContent').innerHTML = `
          <div class="card">
            <div style="text-align: center; padding: 2rem; color: var(--danger);">
              <h3>خطأ</h3>
              <p>لم يتم تحديد الطبيب المطلوب</p>
              <a href="index.html" class="btn primary">العودة للرئيسية</a>
            </div>
          </div>
        `;
        return;
      }
      
      try {
        const res = await fetch(`/api/doctors/slug/${encodeURIComponent(doctorSlug)}`);
        if (!res.ok) throw new Error('Doctor not found');
        
        const doctor = await res.json();
        
        // Update page title and header
        document.getElementById('doctorName').textContent = doctor.name;
        document.getElementById('doctorSpecialty').textContent = doctor.specialty || 'طبيب عام';
        document.title = `${doctor.name} — مستشفى المستقبل`;
        
        // Build doctor profile content
        document.getElementById('doctorContent').innerHTML = `
          <div class="card">
            <div style="display: grid; grid-template-columns: auto 1fr; gap: 2rem; align-items: start;">
              <img src="${doctor.image_url || 'assets/doctor1.svg'}" alt="${doctor.name}" 
                   style="width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 4px solid var(--white); box-shadow: var(--shadow-lg);">
              <div>
                <h2 style="margin: 0 0 0.5rem 0; color: var(--primary);">${doctor.name}</h2>
                <p style="font-size: 1.125rem; color: var(--gray-600); margin-bottom: 1rem;">${doctor.specialty || 'طبيب عام'}</p>
                
                <div style="display: grid; gap: 0.75rem; margin-bottom: 1.5rem;">
                  ${doctor.rating ? `
                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                      <span style="color: var(--warning);">⭐</span>
                      <span><strong>التقييم:</strong> ${doctor.rating}/5</span>
                    </div>
                  ` : ''}
                  
                  ${doctor.price ? `
                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                      <span style="color: var(--success);">💰</span>
                      <span><strong>سعر الكشف:</strong> ${doctor.price} ريال</span>
                    </div>
                  ` : ''}
                  
                  <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <span style="color: var(--primary);">🏥</span>
                    <span><strong>التخصص:</strong> ${doctor.specialty || 'طبيب عام'}</span>
                  </div>
                </div>
                
                <div style="display: flex; gap: 1rem;">
                  <a href="booking.html?doctor=${encodeURIComponent(doctor.slug)}" class="btn primary">
                    حجز موعد
                  </a>
                  <button onclick="shareDoctor()" class="btn ghost">
                    مشاركة الملف
                  </button>
                </div>
              </div>
            </div>
          </div>
          
          ${doctor.bio ? `
            <div class="card">
              <h3>نبذة عن الطبيب</h3>
              <p style="line-height: 1.8; color: var(--gray-700);">${doctor.bio}</p>
            </div>
          ` : ''}
          
          ${doctor.certificates ? `
            <div class="card">
              <h3>الشهادات والمؤهلات</h3>
              <div style="white-space: pre-line; line-height: 1.8; color: var(--gray-700);">${doctor.certificates}</div>
            </div>
          ` : ''}
          
          <div class="card">
            <h3>حجز موعد مع ${doctor.name}</h3>
            <p style="margin-bottom: 1.5rem; color: var(--gray-600);">
              احجز موعدك الآن واحصل على استشارة طبية متخصصة
            </p>
            <a href="booking.html?doctor=${encodeURIComponent(doctor.slug)}" class="btn primary" style="font-size: 1.125rem; padding: 1rem 2rem;">
              حجز موعد الآن
            </a>
          </div>
        `;
        
      } catch (error) {
        document.getElementById('doctorContent').innerHTML = `
          <div class="card">
            <div style="text-align: center; padding: 2rem; color: var(--danger);">
              <h3>خطأ في تحميل البيانات</h3>
              <p>لم نتمكن من العثور على الطبيب المطلوب</p>
              <a href="index.html" class="btn primary">العودة للرئيسية</a>
            </div>
          </div>
        `;
      }
    });
    
    function shareDoctor() {
      if (navigator.share) {
        navigator.share({
          title: document.getElementById('doctorName').textContent,
          text: `تعرف على ${document.getElementById('doctorName').textContent} في مستشفى المستقبل`,
          url: window.location.href
        });
      } else {
        // Fallback: copy to clipboard
        navigator.clipboard.writeText(window.location.href).then(() => {
          alert('تم نسخ رابط الملف الشخصي');
        });
      }
    }
  </script>
</body>
</html>
