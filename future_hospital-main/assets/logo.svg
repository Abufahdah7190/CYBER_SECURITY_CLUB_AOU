<svg xmlns="http://www.w3.org/2000/svg" width="220" height="64" viewBox="0 0 440 128" role="img" aria-label="شعار مستشفى المستقبل">
  <defs>
    <linearGradient id="lg" x1="0" x2="1">
      <stop offset="0" stop-color="#00a3ad"/>
      <stop offset="1" stop-color="#0077ff"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="transparent"/>
  <!-- symbol: cross + pulse -->
  <g transform="translate(12,16)">
    <rect x="0" y="0" width="64" height="64" rx="12" fill="url(#lg)"/>
    <g transform="translate(12,12)" fill="#fff">
      <rect x="20" y="0" width="12" height="32" rx="3"></rect>
      <rect x="0" y="10" width="52" height="12" rx="3"></rect>
    </g>
    <polyline points="86,28 98,28 104,18 112,46 122,28 134,28" fill="none" stroke="#0077ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,0)"/>
  </g>
  <!-- text -->
  <g transform="translate(110,36)" font-family="'Cairo', Tahoma, Arial, sans-serif" fill="#06203a">
    <text x="0" y="-2" font-size="26" font-weight="700">مستشفى المستقبل</text>
    <text x="0" y="18" font-size="12" fill="#6b7280">رعاية صحية رقمية متكاملة</text>
  </g>
</svg>
