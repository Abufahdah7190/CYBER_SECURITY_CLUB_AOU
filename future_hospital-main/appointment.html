<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز موعد - المركز الطبي</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page-header">
        <div class="container">
            <h1>حجز موعد</h1>
            <p>احجز موعدك مع أفضل الأطباء</p>
        </div>
    </div>

    <div class="page-content">
        <div class="container">
            <div class="form-container">
                <form id="appointmentForm" class="form-grid">
                    <div class="form-field">
                        <label for="name">الاسم الكامل</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    
                    <div class="form-field">
                        <label for="phone">رقم الهاتف</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>
                    
                    <div class="form-field">
                        <label for="email">البريد الإلكتروني</label>
                        <input type="email" id="email" name="email">
                    </div>
                    
                    <div class="form-field">
                        <label for="doctor">الطبيب</label>
                        <select id="doctor" name="doctor" required>
                            <option value="">اختر الطبيب</option>
                        </select>
                    </div>
                    
                    <div class="form-field">
                        <label for="date">التاريخ</label>
                        <input type="date" id="date" name="date" required>
                    </div>
                    
                    <div class="form-field">
                        <label for="time">الوقت</label>
                        <select id="time" name="time" required>
                            <option value="">اختر الوقت</option>
                            <option value="09:00">9:00 صباحاً</option>
                            <option value="10:00">10:00 صباحاً</option>
                            <option value="11:00">11:00 صباحاً</option>
                            <option value="12:00">12:00 ظهراً</option>
                            <option value="14:00">2:00 مساءً</option>
                            <option value="15:00">3:00 مساءً</option>
                            <option value="16:00">4:00 مساءً</option>
                            <option value="17:00">5:00 مساءً</option>
                        </select>
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" class="btn primary">حجز الموعد</button>
                    </div>
                </form>
                
                <div id="message" class="form-msg" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script>
        // تحميل قائمة الأطباء
        fetch('php/get_doctors.php')
            .then(response => response.json())
            .then(data => {
                const doctorSelect = document.getElementById('doctor');
                data.doctors.forEach(doctor => {
                    const option = document.createElement('option');
                    option.value = doctor.id;
                    option.textContent = `د. ${doctor.name} - ${doctor.specialty}`;
                    doctorSelect.appendChild(option);
                });
            });

        // معالجة إرسال النموذج
        document.getElementById('appointmentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const button = this.querySelector('button[type="submit"]');
            const message = document.getElementById('message');
            
            button.disabled = true;
            button.textContent = 'جاري الحجز...';
            
            fetch('php/book_appointment.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                message.style.display = 'block';
                if (data.success) {
                    message.textContent = data.message;
                    message.className = 'form-msg success-container';
                    this.reset();
                } else {
                    message.textContent = data.message;
                    message.className = 'form-msg error-container';
                }
            })
            .finally(() => {
                button.disabled = false;
                button.textContent = 'حجز الموعد';
            });
        });

        // تعيين الحد الأدنى للتاريخ (اليوم)
        document.getElementById('date').min = new Date().toISOString().split('T')[0];
    </script>
</body>
</html>
