<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>قسم — مستشفى المستقبل</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .dept-page{padding:40px}
    .dept-card{max-width:900px;margin:0 auto;background:#fff;padding:20px;border-radius:12px}
    .doc-list{margin-top:12px}
  </style>
</head>
<body>
  <header class="site-header"><div class="container header-inner"><a class="brand" href="/">مستشفى المستقبل</a></div></header>
  <main id="main" class="dept-page">
    <div class="container">
      <div id="content" class="dept-card">جارٍ التحميل...</div>
    </div>
  </main>
  <script>
    async function fetchDept(key){
      const res = await fetch('/api/departments/' + encodeURIComponent(key));
      if(!res.ok){document.getElementById('content').innerText='القسم غير موجود'; return}
      const d = await res.json();
      document.title = d.name + ' — مستشفى المستقبل';
      const docs = (d.doctors || []).map(x=>`<li><a href="/doctors/${x.slug}">${x.name} — ${x.specialty||''}</a></li>`).join('');
      document.getElementById('content').innerHTML = `
        <h1>${d.name}</h1>
        <p>${d.description || ''}</p>
        <h3>الأطباء في القسم</h3>
        <ul class="doc-list">${docs || '<li>لا توجد بيانات</li>'}</ul>
      `;
    }
    (function(){
      const parts = location.pathname.split('/');
      const key = parts[parts.length-1] || '';
      fetchDept(key);
    })();
  </script>
</body>
</html>
