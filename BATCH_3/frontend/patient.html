<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>حساب المريض — مستشفى المستقبل</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <span class="brand-name">مستشفى المستقبل</span>
      </a>
      <nav class="main-nav">
        <a href="index.html">الرئيسية</a>
        <a href="booking.html" class="btn">حجز موعد</a>
        <button id="logoutBtn" class="btn ghost">تسجيل خروج</button>
      </nav>
    </div>
  </header>
  
  <div class="page-header">
    <div class="container">
      <h1>مرحباً بك في حسابك</h1>
      <p>إدارة مواعيدك ومتابعة حالتك الصحية</p>
    </div>
  </div>

  <main class="page-content">
    <div class="container">
      <div class="cards">
        <div class="card">
          <h3>معلوماتي الشخصية</h3>
          <div id="userInfo">جارٍ التحميل...</div>
        </div>
        
        <div class="card">
          <h3>إحصائيات سريعة</h3>
          <div id="stats">
            <div style="display: flex; justify-content: space-between; margin-bottom: 1rem;">
              <span>إجمالي المواعيد:</span>
              <strong id="totalAppointments">0</strong>
            </div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 1rem;">
              <span>المواعيد القادمة:</span>
              <strong id="upcomingAppointments">0</strong>
            </div>
            <div style="display: flex; justify-content: space-between;">
              <span>المواعيد المكتملة:</span>
              <strong id="completedAppointments">0</strong>
            </div>
          </div>
        </div>
      </div>
      
      <div class="card" style="margin-top: 2rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
          <h3>مواعيدي</h3>
          <a href="booking.html" class="btn primary">حجز موعد جديد</a>
        </div>
        <div id="content">جارٍ التحميل...</div>
      </div>
    </div>
  </main>
  <script>
    async function api(path, method='GET', body){
      const token = localStorage.getItem('patient_token');
      const headers = body ? {'Content-Type':'application/json'} : {};
      if(token) headers['Authorization'] = 'Bearer ' + token;
      const res = await fetch('/api' + path, {method, headers, body: body ? JSON.stringify(body) : undefined});
      if(res.status===401){ 
        localStorage.removeItem('patient_token');
        location.href='/login.html'; 
        return null;
      }
      return res.json();
    }
    
    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleDateString('ar-SA', {
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }
    
    function getStatusBadge(status) {
      const statusMap = {
        'pending': { text: 'في الانتظار', color: 'var(--warning)' },
        'confirmed': { text: 'مؤكد', color: 'var(--success)' },
        'completed': { text: 'مكتمل', color: 'var(--primary)' },
        'cancelled': { text: 'ملغي', color: 'var(--danger)' }
      };
      const statusInfo = statusMap[status] || { text: status, color: 'var(--gray-500)' };
      return `<span style="background: ${statusInfo.color}; color: white; padding: 0.25rem 0.5rem; border-radius: 0.25rem; font-size: 0.75rem;">${statusInfo.text}</span>`;
    }
    
    document.addEventListener('DOMContentLoaded', async ()=>{
      // Check if user is logged in
      if (!localStorage.getItem('patient_token')) {
        location.href = '/login.html';
        return;
      }
      
      // Load user info
      try {
        const userInfo = await api('/users/me');
        if (userInfo) {
          document.getElementById('userInfo').innerHTML = `
            <div style="display: grid; gap: 0.5rem;">
              <div><strong>الاسم:</strong> ${userInfo.name || 'غير محدد'}</div>
              <div><strong>الهاتف:</strong> ${userInfo.phone || 'غير محدد'}</div>
              <div><strong>البريد:</strong> ${userInfo.email || 'غير محدد'}</div>
            </div>
          `;
        }
      } catch (error) {
        document.getElementById('userInfo').innerHTML = 'خطأ في تحميل البيانات';
      }
      
      // Load appointments from localStorage
      const content = document.getElementById('content');
      content.innerText = 'جارٍ التحميل...';
      
      try {
        // Try to load from API first, fallback to localStorage
        let appointments = [];
        try {
          appointments = await api('/users/me/appointments') || [];
        } catch (error) {
          // Fallback to localStorage
          appointments = JSON.parse(localStorage.getItem('user_appointments') || '[]');
        }
        
        // Update stats
        const total = appointments.length;
        const upcoming = appointments.filter(a => a.status === 'confirmed' || a.status === 'pending').length;
        const completed = appointments.filter(a => a.status === 'completed').length;
        
        document.getElementById('totalAppointments').textContent = total;
        document.getElementById('upcomingAppointments').textContent = upcoming;
        document.getElementById('completedAppointments').textContent = completed;
        
        if (!appointments.length) {
          content.innerHTML = `
            <div style="text-align: center; padding: 2rem; color: var(--gray-500);">
              <p>لا توجد مواعيد حالياً</p>
              <a href="booking.html" class="btn primary" style="margin-top: 1rem;">حجز موعدك الأول</a>
            </div>
          `;
          return;
        }
        
        const appointmentsHtml = appointments.map(a => `
          <div class="card" style="margin-bottom: 1rem; padding: 1.5rem;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem;">
              <div>
                <h4 style="margin: 0 0 0.5rem 0; color: var(--primary);">موعد #${a.id}</h4>
                <p style="margin: 0; color: var(--gray-600);">${a.department || 'غير محدد'}</p>
              </div>
              ${getStatusBadge(a.status)}
            </div>
            
            <div style="display: grid; gap: 0.5rem; margin-bottom: 1rem;">
              <div><strong>المريض:</strong> ${a.name || 'غير محدد'}</div>
              <div><strong>الهاتف:</strong> ${a.phone || 'غير محدد'}</div>
              <div><strong>التاريخ:</strong> ${formatDate(a.appointment_time || a.created_at)}</div>
              ${a.doctor_name ? `<div><strong>الطبيب:</strong> ${a.doctor_name}</div>` : ''}
              ${a.notes ? `<div><strong>ملاحظات:</strong> ${a.notes}</div>` : ''}
            </div>
            
            <div style="display: flex; gap: 0.5rem;">
              ${a.status === 'pending' || a.status === 'confirmed' ? `
                <button class="btn ghost" onclick="cancelAppointment(${a.id})">إلغاء الموعد</button>
              ` : ''}
              ${a.status === 'confirmed' ? `
                <button class="btn primary" onclick="rescheduleAppointment(${a.id})">إعادة جدولة</button>
              ` : ''}
            </div>
          </div>
        `).join('');
        
        content.innerHTML = appointmentsHtml;
        
      } catch (error) {
        content.innerHTML = 'خطأ في تحميل المواعيد';
      }
    });
    
    // Logout functionality
    document.getElementById('logoutBtn').addEventListener('click', () => {
      if (confirm('هل تريد تسجيل الخروج؟')) {
        localStorage.removeItem('patient_token');
        location.href = '/index.html';
      }
    });
    
    // Cancel appointment function
    async function cancelAppointment(appointmentId) {
      if (confirm('هل تريد إلغاء هذا الموعد؟')) {
        try {
          // Try API first, fallback to localStorage
          try {
            await api(`/appointments/${appointmentId}/cancel`, 'POST');
          } catch (error) {
            // Update in localStorage
            const appointments = JSON.parse(localStorage.getItem('user_appointments') || '[]');
            const updatedAppointments = appointments.map(a => 
              a.id == appointmentId ? {...a, status: 'cancelled'} : a
            );
            localStorage.setItem('user_appointments', JSON.stringify(updatedAppointments));
          }
          location.reload();
        } catch (error) {
          alert('خطأ في إلغاء الموعد');
        }
      }
    }
    
    // Reschedule appointment function
    function rescheduleAppointment(appointmentId) {
      location.href = `/booking.html?reschedule=${appointmentId}`;
    }
    
    // Make functions global for onclick handlers
    window.cancelAppointment = cancelAppointment;
    window.rescheduleAppointment = rescheduleAppointment;
  </script>
</body>
</html>
